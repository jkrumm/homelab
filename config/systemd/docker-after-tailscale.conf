# Installed by setup.sh as /etc/systemd/system/docker.service.d/10-after-tailscale.conf.
# samba, beszel-agent, docker-socket-proxy-claude and proton-bridge publish ports on the
# Tailscale IP; if dockerd starts before tailscale0 has it, those binds fail and nothing
# restarts them. Bounded wait, never fatal — tunnel-fronted public services must still
# come up when Tailscale is broken.
[Unit]
After=tailscaled.service
Wants=tailscaled.service

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 1 90); do ip -4 addr show dev tailscale0 2>/dev/null | grep -q inet && exit 0; sleep 1; done; echo "tailscale0 has no IPv4 after 90s, starting docker anyway"; exit 0'
