# Installed by setup.sh as /etc/systemd/system/user.slice.d/50-batch-weight.conf.
# Everything started from an SSH session (ad-hoc corpus jobs, builds) lives in
# user.slice; every container lives in system.slice. nice(1) only orders tasks
# *inside* one cgroup, so a `nice -n 19` job alone in user.slice still takes every
# core from the stack (2026-11-14: cut_windows.py, 4 workers at nice 19, load 22-29,
# Uptime Kuma push endpoint answering in 7-14 s). A lower weight makes the stack win
# whenever both want CPU/disk; an otherwise idle host is unaffected.
[Slice]
CPUWeight=20
IOWeight=20
