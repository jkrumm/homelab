# host-agent, container half: container.* metrics through the read-only docker-socket-proxy (never the raw socket).
# Same docker_stats set as the VPS (vps repo, agent/config/vps-probe.yaml), without the HTTP and ICMP checks.
# Runs on the bridge network (`socket-proxy`, plus `host-agent-egress` for the line out): docker_stats reaches the proxy
# by name. Host metrics are the other half (host.yaml). Environment (docker-compose.yml):
#   AGENT_OTLP_ENDPOINT, AGENT_OTLP_KEY as in host.yaml
#   DOCKER_ENDPOINT     tcp://docker-socket-proxy:2375

extensions:
  file_storage/queue:
    directory: /var/lib/host-agent/queue
    create_directory: true

receivers:
  docker_stats:
    endpoint: ${env:DOCKER_ENDPOINT}
    collection_interval: 30s
    metrics:
      # The set the Infra dashboard and its alerts read. Network and block I/O per container are left out: the host
      # half already reports both for the machine, and per-interface series per container multiply the row count.
      container.restarts:
        enabled: true
      container.state.health.status:
        enabled: true
      container.blockio.io_service_bytes_recursive:
        enabled: false
      container.cpu.usage.kernelmode:
        enabled: false
      container.cpu.usage.usermode:
        enabled: false
      container.cpu.usage.total:
        enabled: false
      container.memory.file:
        enabled: false
      container.memory.total_cache:
        enabled: false
      container.network.io.usage.rx_bytes:
        enabled: false
      container.network.io.usage.tx_bytes:
        enabled: false
      container.network.io.usage.rx_dropped:
        enabled: false
      container.network.io.usage.tx_dropped:
        enabled: false

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 96
    spike_limit_mib: 24
  batch:
    timeout: 15s
  resource:
    attributes:
      - { key: host.name, value: homelab, action: upsert }
      - { key: service.name, value: host-probe, action: upsert }
      - { key: service.namespace, value: infra, action: upsert }
      - { key: deployment.environment.name, value: prod, action: upsert }

exporters:
  otlphttp/clickstack:
    endpoint: ${env:AGENT_OTLP_ENDPOINT}
    headers:
      authorization: ${env:AGENT_OTLP_KEY}
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      storage: file_storage/queue
      queue_size: 5000

service:
  extensions: [file_storage/queue]
  telemetry:
    metrics:
      level: none
    logs:
      level: info
  pipelines:
    metrics:
      receivers: [docker_stats]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/clickstack]
