name: homelab

services:
  # Read-only socket proxy for monitoring services (Glance, Dozzle, Beszel, UptimeKuma)
  # POST=0 — no write operations possible
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '2'
    environment:
      # Read-only access to container/image info
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      NETWORKS: 1
      VOLUMES: 1
      EVENTS: 1 # Dozzle: real-time container event stream
      VERSION: 1 # Docker clients negotiate API version on connect
      # Disable all write operations
      POST: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 0
      GRPC: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      socket-proxy:
    labels:
      glance.hide: true

  # Write-enabled socket proxy for Watchtower only (POST+DELETE required for pull/stop/recreate)
  # Isolated on its own network — monitoring proxy is unaffected
  docker-socket-proxy-watchtower:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy-watchtower
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '2'
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      INFO: 1
      VERSION: 1
      POST: 1 # required: stop/start/pull/recreate
      DELETE: 1 # required: remove old containers after update
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - socket-proxy-watchtower
    labels:
      glance.hide: true
      com.centurylinklabs.watchtower.enable: 'false'

  caddy:
    image: caddybuilds/caddy-cloudflare:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - '443:443'
      - '80:80'
    networks:
      - cloudflared
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - /home/jkrumm/homelab-private/config/caddy:/etc/caddy/private:ro
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - HOMELAB_TAILSCALE_IP=${HOMELAB_TAILSCALE_IP}
    labels:
      glance.parent: uptime
      glance.name: Caddy
      glance.hide: false
      com.centurylinklabs.watchtower.enable: 'true'

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run ${CLOUDFLARE_TUNNEL_ID}
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TOKEN}
    volumes:
      - ./config/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    depends_on:
      - caddy
      - glance
      - uptime-kuma
      - immich-server
    networks:
      - cloudflared
    labels:
      glance.parent: uptime
      glance.name: Cloudflared
      glance.hide: false

  samba:
    image: ghcr.io/servercontainers/samba
    container_name: samba
    restart: unless-stopped
    # Bound to the Tailscale IP: Docker-published ports bypass UFW, so a 0.0.0.0 bind
    # would expose SMB to the LAN regardless of the UFW rule. 139 (NetBIOS) is dropped —
    # macOS talks SMB3 on 445 directly.
    ports:
      - '${HOMELAB_TAILSCALE_IP}:445:445'
    environment:
      AVAHI_NAME: StorageServer
      MODEL: 'Macmini'
      NETBIOS_DISABLE: 'yes'
      SAMBA_CONF_LOG_LEVEL: 1
      ACCOUNT_jkrumm: ${SAMBA_PASSWORD}
      # The image appends SAMBA_GLOBAL_STANZA to [global] (later keys override its
      # defaults). Durable handles need kernel share modes + posix locking off, which
      # lets the macOS client resume open files after a short network drop; the
      # keepalive socket options reap half-open sessions left by a sleeping MacBook.
      SAMBA_GLOBAL_STANZA: 'min protocol=SMB3; smb encrypt=desired; vfs objects=catia fruit streams_xattr; fruit:metadata=stream; fruit:model=MacSamba; fruit:veto_appledouble=no; fruit:nfs_aces=no; fruit:wipe_intentionally_left_blank_rfork=yes; fruit:delete_empty_adfiles=yes; fruit:posix_rename=yes; durable handles=yes; kernel oplocks=no; kernel share modes=no; posix locking=no; socket options=TCP_NODELAY SO_KEEPALIVE TCP_KEEPIDLE=60 TCP_KEEPINTVL=10 TCP_KEEPCNT=6'
      SAMBA_VOLUME_CONFIG_ssd: '[SSD]; path=/mnt/ssd; valid users=jkrumm; guest ok=no; read only=no; browseable=yes; comment=SSD'
      SAMBA_VOLUME_CONFIG_hdd: '[HDD]; path=/mnt/hdd; valid users=jkrumm; guest ok=no; read only=no; browseable=yes; comment=HDD'
    # [SSD] is the user data tree only — service state under ~/ssd (proton-bridge vault,
    # uptime-kuma DB) stays off the share.
    volumes:
      - /home/jkrumm/ssd/SSD:/mnt/ssd
      - /mnt/hdd:/mnt/hdd
    labels:
      glance.name: Samba
      glance.icon: si:protondrive
      glance.url: https://files.jkrumm.com
      glance.hide: false

  beszel:
    image: henrygd/beszel
    container_name: beszel
    restart: unless-stopped
    networks:
      - cloudflared
      - beszel
    volumes:
      - /mnt/hdd/beszel:/beszel_data
    labels:
      glance.name: Beszel
      glance.icon: si:graylog
      glance.url: https://beszel.jkrumm.com
      glance.hide: false

  beszel-agent:
    image: 'henrygd/beszel-agent'
    container_name: beszel-agent
    restart: unless-stopped
    ports:
      - '${HOMELAB_TAILSCALE_IP}:45876:45876'
    networks:
      - beszel
      - socket-proxy
    volumes:
      - /mnt/hdd/.beszel:/extra-filesystems/hdd:ro
    environment:
      PORT: 45876
      KEY: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIInimIOc9SESgXhpaYcyJWwf/JZmP7WSvHtdqhPqMZEf'
      FILESYSTEMS: /sda/sda3
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    depends_on:
      - docker-socket-proxy
    labels:
      glance.hide: true

  glance:
    image: glanceapp/glance
    container_name: glance
    volumes:
      - ./config:/app/config
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - '8080:8080'
    networks:
      - cloudflared
      - socket-proxy
    environment:
      - IMMICH_API_KEY=${IMMICH_API_KEY}
    depends_on:
      - docker-socket-proxy
    restart: unless-stopped
    labels:
      glance.name: Glance
      glance.parent: uptime
      glance.icon: si:hashnode
      glance.url: https://glance.jkrumm.com
      glance.hide: false

  # Restic backup → Backblaze B2 (S3-compatible, EU Central).
  # Repo: s3://jkrumm/backups/homelab/restic
  # Append-only key (op://common/backblaze-s3, no delete perms) for ransomware
  # safety; manual prune via `make restic-prune` from Mac with master key
  # (op://Private/Backblaze B2). See AGENTS.md "Backups" for the full design.
  restic-backup:
    image: mazzolino/restic:latest
    container_name: restic-backup
    hostname: homelab
    restart: unless-stopped
    environment:
      RESTIC_REPOSITORY: s3:https://s3.eu-central-003.backblazeb2.com/jkrumm/backups/homelab/restic
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      AWS_ACCESS_KEY_ID: ${B2_RESTIC_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${B2_RESTIC_APP_KEY}
      RESTIC_CACHE_DIR: /cache
      BACKUP_CRON: "0 30 3 * * *" # daily 03:30 (6-field: sec min hour dom mon dow)
      RESTIC_BACKUP_SOURCES: /sources
      RESTIC_BACKUP_ARGS: >-
        --tag homelab
        --exclude-file=/excludes.txt
        --skip-if-unchanged
      RESTIC_FORGET_ARGS: >-
        --tag homelab
        --keep-daily 14
        --keep-weekly 8
        --keep-monthly 12
        --keep-yearly 5
      POST_COMMANDS_SUCCESS: |-
        wget -q -O - --timeout=10 --tries=3 "${RESTIC_HEARTBEAT_URL}?status=up&msg=ok" || true
      POST_COMMANDS_FAILURE: |-
        wget -q -O - --timeout=10 --tries=3 "${RESTIC_HEARTBEAT_URL}?status=down&msg=fail" || true
      TZ: Europe/Berlin
    volumes:
      - /home/jkrumm/ssd/SSD/Bilder:/sources/Bilder:ro
      - /home/jkrumm/ssd/SSD/Dokumente:/sources/Dokumente:ro
      - /home/jkrumm/ssd/SSD/Bücher:/sources/Buecher:ro
      - /home/jkrumm/ssd/SSD/Videos:/sources/Videos:ro
      - /home/jkrumm/ssd/SSD/Public:/sources/Public:ro
      - /home/jkrumm/ssd/SSD/Dev:/sources/Dev:ro
      - /mnt/hdd/fuji/RAWs:/sources/Fuji-RAWs:ro
      - /mnt/hdd/backups:/sources/hermes-backup:ro
      - /mnt/hdd/karakeep/data:/sources/Karakeep:ro
      - /home/jkrumm/ssd/proton-bridge:/sources/ProtonBridge:ro
      - /mnt/hdd/restic/cache:/cache
      - ./restic-excludes.txt:/excludes.txt:ro
    labels:
      glance.parent: uptime
      glance.name: Restic Backup
      glance.icon: si:restic
      glance.hide: false
      com.centurylinklabs.watchtower.enable: 'true'

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /home/jkrumm/.docker/config.json:/config.json:ro
    networks:
      - socket-proxy-watchtower
      - watchtower-egress
    depends_on:
      - docker-socket-proxy-watchtower
    environment:
      TZ: Europe/Berlin
      DOCKER_HOST: tcp://docker-socket-proxy-watchtower:2375
      DOCKER_CONFIG: /
      DOCKER_API_VERSION: '1.44'
      WATCHTOWER_CLEANUP: 'true'
      WATCHTOWER_SCHEDULE: '0 0 4 * * *'
      WATCHTOWER_NOTIFICATION_URL: '${SLACK_WATCHTOWER_URL}'
      WATCHTOWER_NOTIFICATIONS_LEVEL: warn
      WATCHTOWER_NO_STARTUP_MESSAGE: 'true'
      WATCHTOWER_WARN_ON_HEAD_FAILURE: never
    labels:
      glance.parent: uptime
      glance.name: Watchtower
      glance.icon: si:watchtower
      glance.hide: false
      com.centurylinklabs.watchtower.enable: 'false' # don't self-update

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - '3010:3001'
    networks:
      - cloudflared
      - socket-proxy
    environment:
      - SQLITE_BUSY_TIMEOUT=30000
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    # Note: IPv6 not available in Docker bridge network. VPS monitors have
    # increased retries (3x) to handle intermittent IPv4 timeouts from
    # Deutsche Telekom routing issues to Cloudflare.
    volumes:
      - /home/jkrumm/ssd/uptime-kuma:/app/data
    depends_on:
      - docker-socket-proxy
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    labels:
      glance.name: Uptime Kuma
      glance.icon: si:uptimekuma
      glance.url: https://uptime.jkrumm.com
      glance.hide: false
      glance.id: uptime

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    environment:
      DOZZLE_HOSTNAME: HomeLab
      DOZZLE_ADDR: :8081
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_AUTH_TTL: 87600h
      DOZZLE_REMOTE_AGENT: ${VPS_TAILSCALE_IP}:7007
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    volumes:
      - ./dozzle:/data
    networks:
      - cloudflared
      - socket-proxy
    depends_on:
      - docker-socket-proxy
    labels:
      glance.name: Dozzle
      glance.icon: si:logstash
      glance.url: https://dozzle.jkrumm.com
      glance.hide: false

  dozzle-watchdog-logs:
    container_name: homelab-watchdog-logs
    image: alpine
    volumes:
      - /var/log/homelab_watchdog.log:/var/log/stream.log
    command:
      - tail
      - -f
      - /var/log/stream.log
    network_mode: none
    restart: unless-stopped
    labels:
      glance.hide: true
      com.centurylinklabs.watchtower.enable: 'false'

  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v3.1.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'
    extends:
      file: config/hwaccel.transcoding.yml
      service: quicksync
    volumes:
      # DO NOT change this to :/data to "match upstream" (upstream moved to
      # ${UPLOAD_LOCATION}:/data). The DB stores absolute asset paths under
      # /usr/src/app/upload. detectMediaLocation() picks between /data (always
      # present, the image declares VOLUME /data) and /usr/src/app/upload; today
      # both exist and it tie-breaks to ours. Drop this mount and it resolves to
      # /data, onBootstrap sees a changed location, its guard passes, and it runs
      # migrateFilePaths() — a bulk rewrite of every asset path row.
      # See server/src/services/storage.service.ts and docs/src/pages/errors.md.
      - /home/jkrumm/ssd/SSD/Bilder/immich/upload:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
      # External library - read-only mount for Fuji photos
      - /home/jkrumm/ssd/SSD/Bilder/Fuji:/mnt/media/fuji:ro
    # No host port: Caddy and Glance reach immich-server over Docker networks, so a
    # published 2283 would only add a LAN door.
    networks:
      - cloudflared
      - immich
    environment:
      # Inert here: upstream treats UPLOAD_LOCATION as a *host* path, and the
      # server reads IMMICH_MEDIA_LOCATION. Kept anyway — deleting it buys
      # nothing and costs a server recreate.
      - UPLOAD_LOCATION=/usr/src/app/upload
      - DB_USERNAME=postgres
      - DB_PASSWORD=${POSTGRES_DB_PASSWORD}
      - DB_DATABASE_NAME=immich
      - DB_HOSTNAME=immich_postgres
      - REDIS_HOSTNAME=immich_redis
      - TZ=Europe/Berlin
    # Bare list form, matching upstream — not drift. It only means
    # "started", so this races postgres on a cold `compose up`; immich-server
    # retries its DB connection, which is upstream's own posture. Upgrading to
    # `condition: service_healthy` on both is a real improvement *over* upstream
    # (both dependencies do have working healthchecks — see immich_postgres
    # below), but it recreates immich_server and makes it fail closed if postgres
    # ever reports a checksum failure. Note it would not help after a host
    # reboot: the daemon's restart policy starts containers without re-evaluating
    # depends_on conditions.
    depends_on:
      - immich_redis
      - immich_postgres
    deploy:
      resources:
        limits:
          memory: 4G
    labels:
      glance.name: Immich
      glance.icon: si:immich
      glance.url: https://immich.jkrumm.com
      glance.hide: false
      com.centurylinklabs.watchtower.enable: 'false' # managed by /upgrade-stack immich

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v3.1.0-openvino
    restart: unless-stopped
    extends:
      file: config/hwaccel.ml.yml
      service: openvino
    volumes:
      - model-cache:/cache
    networks:
      - immich
    environment:
      - REDIS_HOSTNAME=immich_redis
      - TZ=Europe/Berlin
    deploy:
      resources:
        limits:
          memory: 4G
    labels:
      glance.hide: true
      com.centurylinklabs.watchtower.enable: 'false' # managed by /upgrade-stack immich

  immich_redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping || exit 1
    networks:
      - immich
    labels:
      glance.hide: true
      com.centurylinklabs.watchtower.enable: 'false' # digest-pinned, managed by /upgrade-stack immich

  immich_postgres:
    # NOTE: no `healthcheck:` key here on purpose — this service IS health-probed.
    # The image ships its own: CMD-SHELL /usr/local/bin/healthcheck.sh
    # (interval 300s, start_period 300s, start_interval 5s), and compose inherits
    # an image HEALTHCHECK unless you set `disable: true`. That script runs
    # pg_isready AND asserts SUM(checksum_failures)=0 — the counterpart to
    # POSTGRES_INITDB_ARGS: '--data-checksums' below. A hand-rolled `pg_isready`
    # would override it and silently discard corruption detection. Do not add one.
    #
    # Avoid editing anything inside this block at all: any change here (even a
    # label) alters the service config hash and recreates the one container whose
    # state you least want recreated. That also rules out adding upstream's
    # cosmetic `healthcheck: {disable: false}` — a pure no-op at recreate cost.
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - /home/jkrumm/ssd/SSD/Bilder/immich/postgres:/var/lib/postgresql/data
    networks:
      - immich
    labels:
      glance.hide: true
      com.centurylinklabs.watchtower.enable: 'false' # digest-pinned, managed by /upgrade-stack immich

  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    user: '1000:1000'
    volumes:
      - /home/jkrumm/ssd/SSD:/srv/ssd
      - /mnt/hdd:/srv/hdd
      - /mnt/hdd/filebrowser:/database
      - /mnt/hdd/filebrowser:/config
    networks:
      - cloudflared
    labels:
      glance.name: Filebrowser
      glance.icon: si:files
      glance.url: https://files.jkrumm.com
      glance.hide: false

  # S3 front over existing directories (VersityGW posix backend): buckets are the bind
  # mounts below, objects stay plain files — Samba, restic and Immich read the same tree.
  # Tailscale-only via Caddy (s3.jkrumm.com). Users/keys live in the internal IAM dir;
  # the gateway root itself holds nothing but the bucket mount points.
  versitygw:
    image: versity/versitygw:latest
    container_name: versitygw
    restart: unless-stopped
    user: '1000:1000'
    environment:
      ROOT_ACCESS_KEY: ${VERSITYGW_ROOT_ACCESS_KEY}
      ROOT_SECRET_KEY: ${VERSITYGW_ROOT_SECRET_KEY}
      VGW_BACKEND: posix
      VGW_BACKEND_ARGS: /data/root
      VGW_PORT: ':7070'
      VGW_IAM_DIR: /data/iam
      VGW_ARGS: '--health /_/health'
      VGW_QUIET: 'true'
    volumes:
      - /home/jkrumm/ssd/versitygw/root:/data/root
      - /home/jkrumm/ssd/versitygw/iam:/data/iam
      # Two buckets = the same two roots Samba and Filebrowser expose. rw on purpose: bucket
      # ACLs/policies are xattrs on the bucket dir itself, so a :ro bind can't hold one.
      - /home/jkrumm/ssd/SSD:/data/root/ssd
      - /mnt/hdd:/data/root/hdd
      # Its own bucket for weatherorb's push key; files sealed by weatherorb-archive-seal.sh.
      - /mnt/hdd/weatherorb-archive:/data/root/weatherorb-archive
    networks:
      - cloudflared
    labels:
      glance.name: S3 (VersityGW)
      glance.icon: si:amazons3
      glance.url: https://s3.jkrumm.com/_/health
      glance.hide: false

  # Read-only Docker socket proxy bound to Tailscale interface — argo API on VPS
  # queries homelab Docker container state via http://${HOMELAB_TAILSCALE_IP}:2376.
  # Mirrors the VPS-side socket-proxy-claude pattern, in reverse.
  docker-socket-proxy-claude:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy-claude
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      CONTAINERS: 1
      STATS: 1
      LOGS: 1
      INFO: 1
      VERSION: 1
      POST: 0
    ports:
      - '${HOMELAB_TAILSCALE_IP}:2376:2375'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy-claude
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'
    labels:
      glance.hide: true

  # Karakeep (read-later / bookmark "everything bucket"; formerly Hoarder).
  # Tailscale-only at karakeep.jkrumm.com. web ⇄ meili (search) ⇄ chrome (crawl)
  # over the private karakeep-internal bridge; Caddy reaches web via the cloudflared bridge.
  # AI auto-tagging via the IU unified OpenAI-compatible endpoint (op://common/anthropic).
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:release
    container_name: karakeep
    restart: unless-stopped
    environment:
      NEXTAUTH_SECRET: ${KARAKEEP_NEXTAUTH_SECRET}
      # Must equal the external host or sign-out/redirects break behind the proxy.
      NEXTAUTH_URL: https://karakeep.jkrumm.com
      DATA_DIR: /data
      MEILI_ADDR: http://karakeep-meili:7700
      MEILI_MASTER_KEY: ${KARAKEEP_MEILI_MASTER_KEY}
      BROWSER_WEB_URL: http://karakeep-chrome:9222
      DISABLE_NEW_RELEASE_CHECK: "true"
      DISABLE_SIGNUPS: "true"   # admin account created; signups now closed
      # AI via the IU unified OpenAI-compatible endpoint. Model ids are IU-served and
      # probe-verified callable (text = modelpick's committed cheap/classification tier).
      # INFERENCE_OUTPUT_SCHEMA=json forces json_object mode: the IU/DeepSeek path doesn't
      # guarantee OpenAI's json_schema "structured" outputs (Karakeep's default), which
      # would otherwise silently break tagging.
      OPENAI_BASE_URL: ${KARAKEEP_OPENAI_BASE_URL}
      OPENAI_API_KEY: ${KARAKEEP_OPENAI_API_KEY}
      INFERENCE_TEXT_MODEL: DeepSeek-V4-Flash
      INFERENCE_OUTPUT_SCHEMA: json
      INFERENCE_IMAGE_MODEL: gemini-3.5-flash  # vision tagging; only fires for image-asset bookmarks
      INFERENCE_ENABLE_AUTO_TAGGING: "true"
      INFERENCE_ENABLE_AUTO_SUMMARIZATION: "false"
      # Embedding model for semantic / similar-bookmark search. NOTE: the embeddings subsystem
      # is NOT active in the running release (karakeep 0.32.0) — no embedding worker starts and
      # no vector index is created; it lives in karakeep's main branch, not yet released. This
      # var IS recognized (and equals the default), so it's staged for when :release ships the
      # feature — at which point text-embedding-3-small (IU-served, probe-verified callable,
      # 1536 native dims) is used. Tagging is the active AI feature today.
      EMBEDDING_TEXT_MODEL: text-embedding-3-small
    volumes:
      - /mnt/hdd/karakeep/data:/data
    networks:
      - cloudflared
      - karakeep-internal
    depends_on:
      - karakeep-meili
      - karakeep-chrome
    deploy:
      resources:
        limits:
          memory: 1G
    labels:
      glance.name: Karakeep
      glance.icon: si:karakeep
      glance.url: https://karakeep.jkrumm.com
      glance.hide: false

  # Headless Chrome for crawling + screenshots. Needs egress (karakeep-internal is a
  # plain bridge). Pinned tag — Watchtower must not bump it.
  # Karakeep's own image since 0.33.x — the previous gcr.io/zenika-hub/alpine-chrome:124
  # is abandoned and no longer pullable (its GCR project has billing disabled), so the
  # container only survived on a cached layer. The entrypoint forwards :9222 itself:
  # passing --remote-debugging-* here breaks that forwarding, and sandboxing is handled
  # inside the image, so --no-sandbox is gone too.
  karakeep-chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:151.0.7922.47-r1
    container_name: karakeep-chrome
    restart: unless-stopped
    init: true
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900
    networks:
      - karakeep-internal
    deploy:
      resources:
        limits:
          memory: 1G
    labels:
      glance.hide: true
      com.centurylinklabs.watchtower.enable: 'false' # upstream-pinned tag

  # Meilisearch — Karakeep's full-text search index (rebuildable from the SQLite DB,
  # so not backed up). Pinned tag — Watchtower must not bump it.
  karakeep-meili:
    image: getmeili/meilisearch:v1.41.0
    container_name: karakeep-meili
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${KARAKEEP_MEILI_MASTER_KEY}
    volumes:
      - /mnt/hdd/karakeep/meili:/meili_data
    networks:
      - karakeep-internal
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      glance.hide: true
      com.centurylinklabs.watchtower.enable: 'false' # upstream-pinned tag

  # Proton Mail Bridge — headless IMAP gateway for hello@ (email-gateway on the VPS reads
  # it over Tailscale). Built from Proton's official signed .deb (packages/proton-bridge).
  # IMAP only, bound to the Tailscale IP: no SMTP (sending stays on Resend), no Caddy,
  # no tunnel. Waits for a one-time interactive login: `make proton-bridge-login`.
  # State (vault, gpg keyring, pass store) lives in /data → restic; docs/proton-bridge.md.
  proton-bridge:
    build:
      context: packages/proton-bridge
      dockerfile: Dockerfile
    container_name: proton-bridge
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - proton-bridge
    ports:
      - '${HOMELAB_TAILSCALE_IP}:1143:143'
    volumes:
      - /home/jkrumm/ssd/proton-bridge:/data
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    labels:
      glance.hide: true
      com.centurylinklabs.watchtower.enable: 'false' # local build, not from registry

volumes:
  model-cache:
  caddy_data:
  caddy_config:

networks:
  cloudflared:
    driver: bridge
  immich:
    driver: bridge
  beszel:
    driver: bridge
  socket-proxy:
    driver: bridge
    internal: true # No external access needed
  socket-proxy-watchtower:
    driver: bridge
    internal: true # No external access needed
  socket-proxy-claude:
    driver: bridge # Bound to host Tailscale IP, not internal
  watchtower-egress:
    driver: bridge # Internet access for Slack notifications (Watchtower)
  proton-bridge:
    driver: bridge # egress to Proton; IMAP published on the Tailscale IP only
  karakeep-internal:
    driver: bridge # Karakeep web ⇄ meili ⇄ chrome; chrome needs egress to crawl pages
