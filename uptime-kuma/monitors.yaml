# Uptime Kuma Monitor Configuration
# Sync with: ssh homelab "cd ~/homelab && op run --env-file=.env.tpl -- uptime-kuma/.venv/bin/python uptime-kuma/sync.py"
# IMPORTANT: sync.py must run ON THE HOMELAB SERVER — it connects to localhost:3010. Never run locally or on VPS.
#
# Secrets are referenced via environment variables (loaded from 1Password)
# - UPTIME_MONITOR_TOKEN: Cloudflare WAF bypass token
# - BETTERSTACK_API_KEY: BetterStack API key
# - FPP_SERVER_AUTH: FPP Server authorization token

settings:
  # Default settings for all monitors (can be overridden per monitor)
  defaults:
    interval: 60
    timeout: 90
    maxretries: 3
    retry_interval: 60
    accepted_statuscodes: ['200-299']
    method: GET

  # Cloudflare WAF bypass header (applied to all external monitors)
  cloudflare_bypass_header:
    X-Uptime-Monitor: '${UPTIME_MONITOR_TOKEN}'

groups:
  # ============================================
  # HomeLab - Local Docker container monitoring
  # ============================================
  - name: HomeLab
    interval: 250
    monitors:
      # --- Infrastructure subgroup ---
      - name: Infrastructure
        type: group
        interval: 200
        monitors:
          - name: Glance - Docker
            type: docker
            docker_container: glance
            interval: 148
            timeout: 120
            maxretries: 5

          - name: Glance - HTTP
            type: http
            url: https://glance.jkrumm.com/
            interval: 150
            cloudflare_bypass: true

          - name: Dozzle - Docker
            type: docker
            docker_container: dozzle
            interval: 153
            timeout: 120
            maxretries: 5

          - name: Dozzle - HTTP
            type: http
            url: http://dozzle:8081/
            interval: 155

          - name: Docker Socket Proxy - Docker
            type: docker
            docker_container: docker-socket-proxy
            interval: 115
            timeout: 120
            maxretries: 5

          - name: Docker Socket Proxy Watchtower - Docker
            type: docker
            docker_container: docker-socket-proxy-watchtower
            interval: 116
            timeout: 120
            maxretries: 5

          - name: Caddy - Docker
            type: docker
            docker_container: caddy
            interval: 118
            timeout: 120
            maxretries: 5

          - name: Cloudflared - Docker
            type: docker
            docker_container: cloudflared
            interval: 121
            timeout: 120
            maxretries: 5

          - name: Watchtower - Docker
            type: docker
            docker_container: watchtower
            interval: 127
            timeout: 120
            maxretries: 5

          - name: Uptime Kuma - Docker
            type: docker
            docker_container: uptime-kuma
            interval: 130
            timeout: 120
            maxretries: 5

          - name: Samba - Docker
            type: docker
            docker_container: samba
            interval: 133
            timeout: 120
            maxretries: 5

          - name: Beszel - Docker
            type: docker
            docker_container: beszel
            interval: 136
            timeout: 120
            maxretries: 5

          - name: Beszel Agent - Docker
            type: docker
            docker_container: beszel-agent
            interval: 139
            timeout: 120
            maxretries: 5

          - name: Restic Backup - Docker
            type: docker
            docker_container: restic-backup
            interval: 142
            timeout: 120
            maxretries: 5

          # Push monitors
          # NOTE: created by hand before 2026-07-28 — uk-sync CAN create push monitors on UK 2.x (proven when it created MacMini Collie - Push).
          - name: HomeLab Watchdog - Push
            type: push
            interval: 700 # Cron runs every 10 min (600s) + buffer for execution
            timeout: 48
            retry_interval: 700

          - name: Restic Backup - Push
            type: push
            interval: 90000 # 25h — daily 03:30 backup cron + buffer
            timeout: 48
            retry_interval: 90000

          # garmin-auto-relogin.sh (homelab/scripts, op-wrapped cron every 2h).
          # Pings on EVERY run — both the no-op skip path (token still fresh)
          # and a successful reauth — so this is a liveness check on the cron
          # itself, not on whether a reauth happened. Deliberately separate
          # from "Garmin Collector - Push" (Local group, further down): that
          # one tracks whether the OAuth token is fresh (and its own comment
          # optimistically assumes this cron "automatically" recovers it);
          # this one is what actually proves the recovery cron is still
          # running. On 2026-08-01 a deleted 1Password item broke `op run`
          # wholesale for all four op-wrapped homelab crons at once — this
          # job included — and none but vpn-watchdog had a heartbeat, so the
          # outage went unnoticed ~17h.
          #
          # interval = 2× the 2h cron cadence (7200s), maxretries: 0 — one
          # skipped run must not page, same doubling used for Garmin
          # Collector - Push's 6h source cadence. Time-to-DOWN = 14400s = 4h.
          #
          # Push URL on the homelab server at
          # ~/.config/uptime-kuma/garmin-relogin-push-url (chmod 600) — not
          # .env.tpl, deliberately: op run resolves the whole template before
          # exec, so one unresolvable ref there would abort every homelab
          # cron, the exact 2026-08-01 incident described above.
          - name: Garmin Auto-Relogin - Push
            type: push
            interval: 14400
            timeout: 48
            retry_interval: 14400
            maxretries: 0

          # BetterStack external monitoring (verifies public accessibility)
          - name: Uptime Kuma - Uptime
            type: http
            url: https://uptime.betterstack.com/api/v2/monitors/3001641
            interval: 130
            timeout: 120
            maxretries: 5
            headers:
              Authorization: 'Bearer ${BETTERSTACK_API_KEY}'

      # --- Files subgroup ---
      - name: Files
        type: group
        interval: 215
        monitors:
          - name: FileBrowser - Docker
            type: docker
            docker_container: filebrowser
            interval: 170
            timeout: 120
            maxretries: 5

          - name: Dufs - Docker
            type: docker
            docker_container: dufs
            interval: 173
            timeout: 120
            maxretries: 5

          - name: Public Files - HTTP
            type: http
            url: https://public.jkrumm.com/
            interval: 179
            cloudflare_bypass: true

      # --- Immich subgroup ---
      - name: Immich
        type: group
        interval: 220
        monitors:
          - name: Immich Server - Docker
            type: docker
            docker_container: immich_server
            interval: 165
            timeout: 120
            maxretries: 5

          - name: Immich ML - Docker
            type: docker
            docker_container: immich_machine_learning
            interval: 170
            timeout: 120
            maxretries: 5

          - name: Immich Redis - Docker
            type: docker
            docker_container: immich_redis
            interval: 175
            timeout: 120
            maxretries: 5

          - name: Immich Postgres - Docker
            type: docker
            docker_container: immich_postgres
            interval: 180
            timeout: 120
            maxretries: 5

          - name: Immich - HTTP
            type: http
            url: https://immich.jkrumm.com/api/server/ping
            interval: 185
            cloudflare_bypass: true
            accepted_statuscodes: ['200-299']

          - name: Immich - Uptime
            type: http
            url: https://uptime.betterstack.com/api/v2/monitors/3069484
            interval: 140
            timeout: 120
            maxretries: 5
            headers:
              Authorization: 'Bearer ${BETTERSTACK_API_KEY}'

      # --- Karakeep subgroup (read-later; web + chrome crawler + meili search) ---
      - name: Karakeep
        type: group
        interval: 248
        monitors:
          - name: Karakeep - Docker
            type: docker
            docker_container: karakeep
            interval: 202
            timeout: 120
            maxretries: 5

          - name: Karakeep Chrome - Docker
            type: docker
            docker_container: karakeep-chrome
            interval: 205
            timeout: 120
            maxretries: 5

          - name: Karakeep Meili - Docker
            type: docker
            docker_container: karakeep-meili
            interval: 208
            timeout: 120
            maxretries: 5

          # Reachable over the cloudflared bridge that UK shares with Karakeep — no
          # Cloudflare/Tailscale hop, like Dozzle. Health endpoint is unauthenticated.
          - name: Karakeep - HTTP
            type: http
            url: http://karakeep:3000/api/health
            interval: 211
            accepted_statuscodes: ['200-299']

      # --- Image Share subgroup (personal photo library — single public host
      # share.jkrumm.com: share links at the root, admin UI under /admin, API
      # under /api) ---
      - name: Image Share
        type: group
        interval: 246
        monitors:
          - name: Image Share - Docker
            type: docker
            docker_container: image-share
            interval: 213
            timeout: 120
            maxretries: 5

          - name: Image Share - HTTP
            type: http
            url: https://share.jkrumm.com/health
            interval: 216
            cloudflare_bypass: true
            accepted_statuscodes: ['200-299']

  # ============================================
  # Local — heartbeats kept alive by a manual/local operation on the Mac, NOT by
  # HomeLab server infrastructure. Grouped separately so a miss here does NOT
  # drag the HomeLab group "down" and imply the server is offline. Down here just
  # means a local op is overdue (run it), not a server incident.
  # ============================================
  - name: Local
    interval: 250
    monitors:
      # Garmin heartbeat — pushed by argo's garmin-sync cron (VPS) after each
      # successful collector pull. Goes down when Garmin OAuth tokens expire.
      # Recovery is automated: homelab's garmin-auto-relogin cron refreshes the
      # token proactively (every 4d) and reactively (within ~2h of an early death)
      # via Gmail-fetched MFA. The 12h interval gives that auto-recovery room to
      # heal silently before paging; a genuinely-stuck recovery (>12h) still alerts.
      # NOTE: created by hand before 2026-07-28 — uk-sync CAN create push monitors on UK 2.x (proven when it created MacMini Collie - Push).
      # Push URL → 1Password common/garmin-collector/PUSH_URL (in `common/` so the
      # VPS service account can read it; argo resolves it as GARMIN_HEARTBEAT_URL).
      - name: Garmin Collector - Push
        type: push
        interval: 43200 # 12h — argo sync runs every 6h; extra cycle = silent auto-recovery room
        timeout: 48
        retry_interval: 43200
        resend_interval: 1 # re-alert Slack every down beat (~12h) once recovery is genuinely stuck

      # Weekly manual 1Password export backup, run locally from the Mac.
      # NOTE: created by hand before 2026-07-28 — uk-sync CAN create push monitors on UK 2.x (proven when it created MacMini Collie - Push).
      - name: 1Password Backup - Push
        type: push
        interval: 691200 # 8 days — weekly manual + buffer
        retry_interval: 691200

      # Weekly secrets-cache seed-freshness heartbeat, pushed from the Mac mini
      # (dotfiles/scripts/secrets-freshness-check.sh, weekly LaunchAgent). A
      # miss/down means "the mini's secret cache is stale — run make secrets-seed".
      # NOTE: created by hand before 2026-07-28 — uk-sync CAN create push monitors on UK 2.x (proven when it created MacMini Collie - Push).
      - name: MacMini Secret Seed - Push
        type: push
        interval: 691200 # 8 days — weekly + buffer
        retry_interval: 691200
        # 0, or time-to-DOWN is interval + 3 × retry_interval = 32 days. The
        # LaunchAgent behind this monitor was dead for 11 days in July 2026 and
        # the monitor never went red — the 8 days above is the whole intent.
        maxretries: 0

      # Remote-dev readiness on the Mac mini — one composite heartbeat covering
      # herdr (the workspace server agents live in), sshd, tailscaled and
      # mosh-server. Pushed by dotfiles/scripts/devhost-health-check.sh via the
      # com.jkrumm.devhost-health LaunchAgent every 5 min (`make
      # devhost-health-setup`). The failing component is named in the push msg.
      #
      # Push, not probe: the ACL grants tag:homelab → tag:vps but NOT
      # tag:homelab → tag:mac, so Kuma cannot reach the mini at all. Opening an
      # inbound grant purely for monitoring would be new attack surface for a
      # check the mini can just as well report on itself.
      # NOTE: created by hand before 2026-07-28 — uk-sync CAN create push monitors on UK 2.x (proven when it created MacMini Collie - Push).
      #
      # maxretries: 0 is load-bearing. A push monitor runs the normal failure
      # path, so time-to-DOWN is `interval + maxretries × retry_interval`. With
      # the file-level default of 3 this would alert after 40 min, not the 10
      # the interval implies. NOTE the same arithmetic applies to every other
      # push monitor here — none override maxretries, so each alerts 4× later
      # than its comment claims (the two 691200s ones are effectively 32-day).
      # Left alone deliberately: changing them shifts live alerting behaviour
      # and is a separate decision.
      - name: MacMini Dev Host - Push
        type: push
        interval: 600 # 10 min — must exceed the agent's 300s cadence so one skipped run doesn't page
        retry_interval: 600
        maxretries: 0

      # Collie — the phone control surface for the herd on the Mac mini
      # (dotfiles: `make collie-setup`). Its OWN monitor rather than a sixth
      # component of the composite above, because it does not fail with the
      # other five: it is opt-in per machine and can be absent, down or
      # mis-hardened while herdr/sshd/tailscaled/mosh are all perfectly fine.
      # Folding it in would mark the dev host DOWN and implicate four healthy
      # components — the same reasoning that keeps the composite composite,
      # pointed the other way.
      #
      # Driven by the SAME agent and script as the monitor above
      # (devhost-health-check.sh, com.jkrumm.devhost-health, every 300s) —
      # one scheduler, two push targets. A second LaunchAgent would be
      # duplication; only the URL differs.
      #
      # What it asserts is deliberately more than liveness: the bridge answers
      # 200 on loopback AND a spoofed Host header still returns 403. Collie's
      # hardening lives in a .env that launchd does not load on its own, so a
      # mis-started bridge passes every liveness probe with its DNS-rebinding
      # guard silently gone — this monitor is the only thing that sees that.
      # Created BY uk-sync (id=205, 2026-07-28) — the first push monitor here that
      # was not made by hand, and the one that disproved the note repeated above.
      - name: MacMini Collie - Push
        type: push
        interval: 600 # 10 min — same 300s agent cadence, one skipped run must not page
        retry_interval: 600
        maxretries: 0

      # The brain vault's continuous sync (dotfiles/brain/brain-sync.sh under
      # com.jkrumm.brain-sync, every 300s on the mini). It pulls, pushes when
      # ahead, and never commits — the mini is the vault's source of truth and
      # the MacBook is a writing mirror; GitHub is the only thing between them.
      #
      # ONLY the mini heartbeats this. The MacBook runs the same agent but gets
      # no monitor deliberately: it is a laptop, so a lid-closed night is a
      # normal state, and a monitor for it would page on nothing. That also
      # rules out one shared monitor for both machines — a healthy mini would
      # mask a MacBook that stopped reaching GitHub entirely.
      #
      # What a DOWN here means is narrow and useful: the mini stopped
      # reconciling. Not that the vault is lost (git holds it) and not that the
      # MacBook is broken (invisible from here) — just that edits are no longer
      # crossing, and the two checkouts are drifting.
      #
      # Push URL on the mini at ~/.config/uptime-kuma/brain-sync-push-url
      # (chmod 600). A plain file, same convention as the Home Line monitor
      # below — the agent reads it, and its absence is a silent no-op, not an
      # error.
      - name: Brain Sync - Push
        type: push
        interval: 600 # 10 min — same 300s agent cadence, one skipped run must not page
        retry_interval: 600
        maxretries: 0 # see the arithmetic above — the default 3 would alert at 40 min, not 10

      # The nightly leftover-dirt sweep (dotfiles/brain/brain-backup.sh under
      # com.jkrumm.brain-backup, 03:30 on the mini). Separate from the monitor
      # above because it fails independently: brain-sync can be reconciling
      # perfectly while the sweep silently stops committing what direct
      # Obsidian edits left behind, and that loss is invisible until someone
      # looks at `git status` days later.
      #
      # Push URL on the mini at ~/.config/uptime-kuma/brain-backup-push-url
      # (chmod 600).
      - name: Brain Backup - Push
        type: push
        interval: 90000 # 25h — nightly 03:30 sweep + buffer, same shape as Restic Backup - Push
        timeout: 48
        retry_interval: 90000
        maxretries: 0 # unlike the older push monitors, this one does not inherit the 4×-late default

      # The home internet line, as measured by linewatch on the Mac mini
      # (~/SourceRoot/linewatch, collector/heartbeat.ts under the
      # com.jkrumm.linewatch-heartbeat LaunchAgent, every 60s).
      #
      # This is the one monitor here that cannot be a probe even in principle.
      # The homelab sits on a different WAN, so Kuma is blind to this line — and
      # that inversion is what makes the monitor work rather than a compromise
      # it settles for: a home-line outage severs the push, Kuma sees the missed
      # heartbeat, and the notification leaves the homelab over a WAN the outage
      # does not touch. The push failing IS the signal.
      #
      # Two failure classes, kept distinguishable inside one monitor rather than
      # split across two that would both fire on the commonest cause:
      #   - silence          → the line (or the mini) is gone
      #   - an explicit DOWN → linewatch stopped measuring while the line works:
      #                        a dead collector, an unreachable API, or the mini
      #                        failed over to Wi-Fi and is no longer measuring
      #                        THIS line at all. The push msg says which.
      # The second class is the one worth having. `GET /api/status` reports
      # `up: true` whenever no cycle is being ingested — the outage state machine
      # has nothing to open a row from — so a collector that died at 02:00 reads
      # as a perfectly healthy line. linewatch's heartbeat-verdict.ts checks
      # sample freshness for exactly that reason, and its test suite asserts it.
      #
      # interval 240 + maxretries 0 → time-to-DOWN is 4 min, four heartbeats of
      # margin. Not a round number: the longest self-recovery in linewatch's
      # record is 90s (outage id 1 — 3 cycles, IPv4 back 14–16s after showtime
      # with no intervention), and 240s is 2.7× that, the same threshold the
      # watchdog spec derives from the same measurement. Shorter pages on blips
      # the line fixes itself.
      #
      # Push URL → 1Password common/linewatch/PUSH_URL, and on the mini at
      # ~/.config/uptime-kuma/linewatch-push-url (chmod 600). A plain file, not
      # the secrets cache: a monitor must not depend on the thing it monitors.
      - name: Home Line - Push
        type: push
        interval: 240
        retry_interval: 240
        maxretries: 0

      # A SECOND push monitor, and the duplication is the point.
      #
      # The one above is silence-means-down: a home-line outage severs the push
      # and the gap IS the alert. That signal cannot also carry "the watchdog
      # latched itself out of service" or "its ledger is unreadable", because
      # those happen on a HEALTHY line — where the monitor above is green, and
      # correctly so. Folding the watchdog's state into its message would mean
      # either lying about the line to raise the alarm, or staying silent about
      # a watchdog that has stopped being able to help.
      #
      # So this one reports the watchdog itself. Down means it has taken itself
      # out of service (two actions without a clean window) or run out of ladder
      # and wants a human. Silence means the agent is gone. A blocked rung and
      # every shadow-mode evaluation are both UP — otherwise the multi-week
      # shadow run this thing ships in would page continuously and be turned off.
      #
      # 600 with 2 retries → ~30 min to DOWN, deliberately slacker than the line
      # monitor. Nothing here is time-critical: a latched watchdog is a state
      # that persists until a human clears it, and paging fast about it would
      # only compete with the line alert during the outage that caused it.
      #
      # Push URL → 1Password common/linewatch/WATCHDOG_PUSH_URL, and on the mini
      # at ~/.config/uptime-kuma/linewatch-watchdog-push-url (chmod 600). Same
      # plain-file rule: a monitor must not depend on the thing it monitors.
      - name: Home Line - Watchdog
        type: push
        interval: 600
        retry_interval: 600
        maxretries: 2

  # ============================================
  # Hermes Agent — runs locally on Mac Mini, not on HomeLab.
  # Push monitors fed by hermes-agent/scripts/{hermes-liveness,hermes-backup}.sh
  # See hermes-agent/README.md "Cron — Liveness + Backup".
  # ============================================
  - name: Hermes Agent
    interval: 250
    monitors:
      # Liveness — every 5 min from hermes-liveness.sh.
      # Push URL → 1Password hermes/uptime-kuma/agent-push-url
      - name: Hermes Agent - Push
        type: push
        interval: 360 # 5 min cron + buffer
        timeout: 48
        retry_interval: 360

      # Watchdog — every 30 min from the watchdog cron (watchdog-slack.py → watchdog-poll.py).
      # Push URL → 1Password hermes/uptime-kuma/watchdog-push-url
      - name: Hermes Watchdog - Push
        type: push
        interval: 2100 # 35 min — 30 min cron + buffer
        timeout: 48
        retry_interval: 2100

      # Daily backup → /mnt/hdd/backups/hermes/ from hermes-backup.sh at 03:00.
      # Push URL → 1Password hermes/uptime-kuma/backup-push-url
      - name: Hermes Backup - Push
        type: push
        interval: 90000 # 25h — daily cron at 03:00 + buffer
        retry_interval: 90000

  # ============================================
  # VPS (Hetzner) - hetzner-vps infrastructure
  # ============================================
  - name: VPS
    interval: 250
    monitors:
      # --- Networking subgroup ---
      - name: Networking
        type: group
        interval: 200
        monitors:
          # DNS points to VPS Tailscale IP (no Cloudflare proxy) — direct Tailscale path.
          # tailscale-only middleware passes since Uptime Kuma's source IP is HomeLab's Tailscale IP.
          - name: Traefik - HTTP
            type: http
            url: https://traefik.jkrumm.com/api/overview
            interval: 121

          - name: RollHook - HTTP
            type: http
            url: https://rollhook.jkrumm.com/health
            interval: 131
            cloudflare_bypass: true

          # /health only proves the process is up. /ready also pings the Docker
          # daemon and returns 503 when it is unreachable — the fault that hid
          # for 16h behind a 200 from /health while every deploy failed. This is
          # that missing alert; polling it also drives RollHook's own stderr
          # logging of the outage.
          # Keyword, not plain http: the dashboard SPA answers unknown routes
          # with 200 + HTML, so a plain http monitor would sit green if /ready
          # ever vanished (e.g. a rollback to <1.19.0).
          - name: RollHook - Ready - HTTP
            type: keyword
            url: https://rollhook.jkrumm.com/ready
            keyword: '"docker":"ok"'
            interval: 134
            cloudflare_bypass: true

      # --- Monitoring subgroup ---
      - name: Monitoring
        type: group
        interval: 210
        monitors:
          - name: HyperDX - HTTP
            type: http
            url: https://hyperdx.jkrumm.com
            interval: 141

          - name: ClickStack OTel - HTTP
            type: http
            url: http://${VPS_TAILSCALE_IP}:13133/
            interval: 131
            accepted_statuscodes: ['200-299']

          - name: Umami - HTTP
            type: http
            url: https://umami.jkrumm.com/api/heartbeat
            interval: 151

      # --- Infra subgroup ---
      - name: Infra
        type: group
        interval: 205
        monitors:
          # NOTE: created by hand before 2026-07-28 — uk-sync CAN create push monitors on UK 2.x (proven when it created MacMini Collie - Push).
          # After creating: copy push URL → 1Password vps/config/UPTIME_KUMA_PUSH_URL
          - name: Postgres - Backup - Push
            type: push
            interval: 90000 # 25h — daily cron at 03:00 UTC + buffer
            retry_interval: 90000

          # Liveness — VPS cron runs SELECT 1 every minute via scripts/health-pg.sh.
          # Push URL → op://vps/config/UPTIME_KUMA_POSTGRES_PUSH_URL
          - name: Postgres - DB - Push
            type: push
            interval: 120 # 2 min — cron runs every 60s + buffer
            timeout: 48
            retry_interval: 120

          # Image CDN (imgproxy) — TWO monitors on purpose, they fail differently.
          #
          # Do NOT probe imgproxy's /health: it is liveness only (verified — it
          # emits no OTLP spans and answers in 1.6ms). An imgproxy that cannot
          # reach B2 still reports healthy while every image 404s, so /health
          # would be a green light over a dead service.
          #
          # Both URLs render a real 12KB probe object, so a 200 means the whole
          # path worked. Source: vps/apps/imgproxy/, docs/image-cdn.md.

          # Public edge path — DNS → Cloudflare → tunnel → Traefik → imgproxy.
          # Renditions carry a 1-year TTL, so after the first check this is
          # answered from the CF edge. That is intentional: this monitor watches
          # the PUBLIC path (DNS, tunnel, CF), not the origin. It will stay green
          # through an origin outage — which is exactly what the Origin monitor
          # below is for. Do not "fix" this one by cache-busting; losing the edge
          # signal would hide a tunnel or DNS failure.
          - name: ImageCDN - HTTP
            type: http
            url: https://img.jkrumm.com/rs:fit:100/misc/monitor-probe.jpg
            interval: 165
            cloudflare_bypass: true

          # Origin path — grey-cloud A record → VPS Tailscale IP → Traefik,
          # bypassing Cloudflare entirely, so EVERY check does a real B2 fetch
          # plus a real libvips render. This is the monitor that actually proves
          # the image pipeline works: it goes red on an expired/revoked B2 key,
          # an unreachable bucket, or a broken imgproxy, none of which the edge
          # monitor or a /health probe would catch.
          # Reached over Tailscale from homelab, so no CF bypass header.
          - name: ImageCDN Origin - HTTP
            type: http
            url: https://img-origin.jkrumm.com/rs:fit:100/misc/monitor-probe.jpg
            interval: 175

      # --- Services subgroup ---
      - name: Services
        type: group
        interval: 215
        monitors:
          - name: BunEmailApi - HTTP
            type: keyword
            url: https://bun-email-api.jkrumm.com/health
            keyword: '{"ok":true}'
            interval: 161
            cloudflare_bypass: true

          # Argo nested folder — dashboard + API on VPS, Tailscale-only via
          # Traefik. Single host argo.jkrumm.com (dashboard at /, API at /api,
          # Traefik strips the /api prefix). DNS is grey-cloud → VPS Tailscale
          # IP, so probes work from homelab UK over Tailscale (no CF bypass).
          # Per uptime-kuma-monitors rule: parent folder provides "Argo" scope,
          # children drop the prefix.
          - name: Argo
            type: group
            interval: 200
            monitors:
              - name: Dashboard - HTTP
                type: http
                url: https://argo.jkrumm.com/
                interval: 145
                accepted_statuscodes: ['200-299']

              - name: API - HTTP
                type: keyword
                url: https://argo.jkrumm.com/api/health
                keyword: '"status":"ok"'
                interval: 150

          # Audio Gateway — OpenAI-compatible STT + Gemini TTS on VPS, Tailscale-
          # only via Traefik. DNS is grey-cloud → VPS Tailscale IP, so the homelab
          # UK probe reaches it over Tailscale (no CF bypass). /health returns
          # {"ok":true} when healthy, 503 while draining.
          - name: Audio Gateway - HTTP
            type: keyword
            url: https://audio-gateway.jkrumm.com/health
            keyword: '"ok":true'
            interval: 150

          # Research Gateway — agentic HTTP research API on VPS, Tailscale-only:
          # grey-cloud, DNS-only A record → VPS Tailscale IP → Traefik, NOT
          # behind the Cloudflare tunnel. /health → {"status":"ok"}.
          - name: Research Gateway - HTTP
            type: keyword
            url: https://research.jkrumm.com/health
            keyword: '{"status":"ok"}'
            cloudflare_bypass: true
            interval: 155

          # Research Gateway's lightpanda JS-rendering sidecar — a SEPARATE
          # monitor on purpose, not a field on the entry above. The renderer
          # is an optional step in the gateway's fetch chain (fetching
          # degrades to Tavily Extract when it's down, research still works),
          # so it deliberately isn't folded into /health — /health gates the
          # Docker healthcheck and rollhook's rollout gate, and a broken
          # renderer must not block deploys of an otherwise-healthy gateway.
          - name: Research Gateway - Renderer - HTTP
            type: keyword
            url: https://research.jkrumm.com/health/render
            keyword: '"renderer":"ok"'
            cloudflare_bypass: true
            interval: 160

  # ============================================
  # FreePlanningPoker - VPS application stack
  # ============================================
  - name: FreePlanningPoker
    interval: 205
    monitors:
      - name: FPP - Frontend - HTTP
        type: http
        url: https://free-planning-poker.com/
        ip_family: 6 # Force IPv6 (IPv4 path has issues)
        cloudflare_bypass: true

      - name: FPP - Server - HTTP
        type: keyword
        url: https://server.free-planning-poker.com/health
        keyword: '{"status":"ok"}'
        ip_family: 6
        cloudflare_bypass: true
        headers:
          Authorization: 'Bearer ${FPP_SERVER_AUTH}'

      - name: FPP - Analytics - HTTP
        type: keyword
        url: https://analytics.free-planning-poker.com/health
        keyword: '"status":"ok"'
        interval: 70
        ip_family: 6
        cloudflare_bypass: true

      - name: FPP - DB - MySQL
        type: mysql
        # Connection details (host, port, user, password, query, SSL) configured
        # in the Uptime Kuma UI — sync.py skips DB monitor updates by design
        # (see DB_MONITOR_TYPES in sync.py) so the password is never in git
        # and survives every future sync. Password lives in
        # op://vps/mariadb/FPP_PASSWORD — paste into UI when creating/rotating.

      - name: FPP - DB Backup - Push
        type: push
        interval: 90000 # 25h — daily cron at 03:30 UTC + buffer
        retry_interval: 90000

      - name: FPP - Analytics Readmodel - Push
        type: push
        interval: 650
        retry_interval: 650

  # ============================================
  # Websites - External website monitoring
  # ============================================
  - name: Websites
    interval: 215
    monitors:
      - name: Photos - HTTP
        type: http
        url: https://photos.jkrumm.com/
        ip_family: 6
        cloudflare_bypass: true

      - name: Photos - Uptime
        type: http
        url: https://uptime.betterstack.com/api/v2/monitors/3670427
        interval: 145
        timeout: 120
        maxretries: 5
        headers:
          Authorization: 'Bearer ${BETTERSTACK_API_KEY}'
        cloudflare_bypass: true

      # Disabled monitors
      # - name: SnowFinder
      #   type: http
      #   url: https://snow-finder.jkrumm.dev/
      #   active: false
      #   cloudflare_bypass: true
